# ByteCode API — nginx reverse proxy.
#
# Install to /etc/nginx/sites-available/bytecode-api and symlink into
# sites-enabled. Get the certificate with:
#   certbot --nginx -d api.example.com
#
# Replace api.example.com throughout.

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # certbot puts its challenge here; everything else goes to TLS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # The API caps code and stdin at 64KB each and express.json() at 1mb.
    # Reject anything larger here, before it reaches node.
    client_max_body_size 1m;

    # CORS is handled by the API (CORS_ORIGINS), not here. Adding
    # add_header Access-Control-* on top would produce duplicate headers,
    # which browsers reject outright.

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A single request can legitimately take a long time: it may wait in
        # the queue (QUEUE_TIMEOUT_MS, 15s) and then compile and run
        # (COMPILE_TIMEOUT_MS + RUN_TIMEOUT_MS, 15s + 10s). That is ~40s with
        # the shipped defaults, so nginx must out-wait the API's own limits —
        # otherwise it returns 504 for requests the API was about to answer
        # properly, and the user sees a gateway error instead of "timed out".
        #
        # Keep this comfortably above the sum of those three values, and raise
        # it if you raise them.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;

        # Program output is small and already capped; no buffering games.
        proxy_buffering off;
    }

    # Cheap liveness probe: unthrottled by design, reports sandbox gate state.
    location = /health {
        proxy_pass http://127.0.0.1:5000/health;
        access_log off;
    }
}
