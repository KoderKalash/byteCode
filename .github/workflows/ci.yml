name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      # The suite puts a stub docker CLI on PATH, so it needs no Docker daemon.
      # See backend/test/fixtures/docker.
      - name: Test
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx next lint

      - name: Build
        working-directory: frontend
        run: npm run build

  sandbox-images:
    name: Sandbox images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The unit suite deliberately stubs Docker out, so this job is what proves
      # the pinned base images still exist and the Dockerfiles are valid.
      - name: Build sandbox images
        working-directory: backend
        run: sh docker/build.sh
